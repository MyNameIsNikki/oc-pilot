name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      # Rebuilds dist and runs the full suite; also covers prepublishOnly.
      - run: npm test

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match $version" >&2
            exit 1
          fi

      # Two supported auth modes:
      # 1. NPM_TOKEN secret is set -> granular/automation token with publish rights.
      # 2. NPM_TOKEN is absent -> Trusted Publishing: npm exchanges the GitHub
      #    OIDC token for a one-time publish credential (no registry-url on purpose).
      - name: Detect npm auth mode
        id: auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with NPM_TOKEN
        if: steps.auth.outputs.mode == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --provenance --access public --ignore-scripts

      - name: Publish with Trusted Publishing
        if: steps.auth.outputs.mode == 'oidc'
        run: npm publish --provenance --access public --ignore-scripts

      - name: Remove npm credentials
        if: always()
        run: rm -f .npmrc

      # The release body is the CHANGELOG section for this version, so the
      # GitHub release and the repository history never drift apart.
      - name: Extract changelog section
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## " ver) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "See CHANGELOG.md for the changes in $GITHUB_REF_NAME." > RELEASE_NOTES.md
          fi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
