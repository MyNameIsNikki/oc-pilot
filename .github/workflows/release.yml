name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      # Rebuilds dist and runs the full suite; also covers prepublishOnly.
      - run: npm test

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match $version" >&2
            exit 1
          fi

      # Trusted publishing: npm exchanges the GitHub OIDC token for a one-time
      # publish credential. No NPM_TOKEN and no registry-url on purpose — the
      # token is minted per run and scoped to this repository and workflow name.
      - run: npm publish --provenance --access public --ignore-scripts

      # The release body is the CHANGELOG section for this version, so the
      # GitHub release and the repository history never drift apart.
      - name: Extract changelog section
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## " ver) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "See CHANGELOG.md for the changes in $GITHUB_REF_NAME." > RELEASE_NOTES.md
          fi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
